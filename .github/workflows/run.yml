name: AiScore Odds Check - Self Hosted

on:
  workflow_dispatch:
    inputs:
      scan_date:
        description: 'Date: YYYYMMDD or YYYY-MM-DD (leave empty for today)'
        required: false
        default: ''
      max_matches:
        description: 'Maximum matches to inspect'
        required: false
        default: '120'

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore scanner state
        uses: actions/cache@v4
        with:
          path: odds_tracker.db
          key: odds-tracker-selfhosted-${{ github.run_id }}
          restore-keys: |
            odds-tracker-selfhosted-
            odds-tracker-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AiScore scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_DATE: ${{ github.event.inputs.scan_date }}
          MAX_MATCHES: ${{ github.event.inputs.max_matches || '120' }}
          AISCORE_BASES: https://vnm.aiscore.com,https://m.aiscore.com,https://www.aiscore.com
        run: python main.py

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiscore-debug-selfhosted-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
          
